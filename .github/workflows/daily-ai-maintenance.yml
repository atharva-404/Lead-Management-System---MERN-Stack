name: Daily AI maintenance

on:
  schedule:
    # 09:17 Asia/Kolkata every day (GitHub supports IANA timezones for schedules).
    - cron: "17 9 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate a proposal but do not open a pull request"
        type: boolean
        default: false

# Least privilege by default; the job below adds only what the PR step needs.
permissions:
  contents: read

# One run per repository at a time; a later run waits instead of cancelling a running one.
concurrency:
  group: daily-ai-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
          # Keep the token out of .git/config: validation steps run AI-written tests.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          # The committed frontend lockfile is out of sync with package.json, so `npm ci` fails.
          npm ci --no-audit --no-fund || {
            echo "::warning::frontend/package-lock.json is out of sync; falling back to npm install"
            npm install --no-audit --no-fund
          }
      - name: Generate a bounded improvement
        id: agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          RUN_DATE: ${{ github.run_started_at }}
        run: python .github/scripts/daily_ai_maintenance.py

      - name: Show proposed changes
        if: steps.agent.outputs.changed == 'true'
        run: |
          {
            echo "### Proposed changes"
            echo '```'
            git status --short
            git diff --stat
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git diff

      - name: Validate - JavaScript syntax
        if: steps.agent.outputs.changed == 'true'
        run: |
          find backend -name '*.js' -not -path '*/node_modules/*' -not -path 'backend/uploads/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Validate - backend tests
        if: steps.agent.outputs.changed == 'true'
        working-directory: backend
        run: node --test

      - name: Validate - frontend tests
        if: steps.agent.outputs.changed == 'true'
        working-directory: frontend
        env:
          CI: "true"
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Validate - frontend build
        if: steps.agent.outputs.changed == 'true'
        working-directory: frontend
        run: npm run build
      - name: Open or update the pull request
        if: steps.agent.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/daily-ai-maintenance
          delete-branch: true
          # Commit exactly the files the agent changed; never build output or lockfile churn.
          add-paths: ${{ steps.agent.outputs.changed_paths }}
          commit-message: ${{ steps.agent.outputs.commit_message }}
          title: ${{ steps.agent.outputs.pr_title }}
          body-path: ${{ steps.agent.outputs.report_path }}